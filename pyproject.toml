[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igv"
version = "0.1.0"
requires-python = ">=3.11"
# torch and boltz are NOT listed here -- they only exist in the GPU container.
# Install them via constraints.txt + the PyTorch cu126 wheel index.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "requests",
    # Parquet engine for pandas. 01_build_library writes the mutant library
    # with to_parquet and 05_predict reads it back; without pyarrow pandas
    # raises ImportError at write time.
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access (deselect with '-m not network')",
]
